<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wedding Invitation | David & Amelia</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wedding Card" />
  <meta property="og:title" content="You're Invited! Wedding Celebration" />
  <meta property="og:description" content="Tap to view our digital wedding invitation, schedule of events, and RSVP." />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-page: #f2ece4;
      --bg-card: #fbf9f5;
      --gold-primary: #b5945b;
      --gold-dark: #8c6d3b;
      --text-main: #4a4238;
      --text-muted: #7a7064;
      --sage: #a3b19b;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      margin: 0;
    }

    .font-script {
      font-family: 'Pinyon Script', cursive;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .font-serif-body {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Arch Card Silhouette */
    .arch-card {
      background-color: var(--bg-card);
      border-radius: 260px 260px 24px 24px;
      box-shadow: 0 20px 60px rgba(74, 66, 56, 0.12), 0 0 0 1px rgba(181, 148, 91, 0.25);
      position: relative;
      overflow: hidden;
    }

    .arch-inner-border {
      border-radius: 250px 250px 18px 18px;
      border: 1px solid rgba(181, 148, 91, 0.35);
      pointer-events: none;
    }

    /* Calligraphic Initial Styling */
    .initial-swash {
      font-family: 'Pinyon Script', cursive;
      font-size: 5.5rem;
      line-height: 0.75;
      color: var(--gold-dark);
      display: inline-block;
      vertical-align: middle;
      margin-right: -4px;
    }

    .name-rest {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      letter-spacing: 0.28em;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .initial-swash { font-size: 4.5rem; }
      .name-rest { font-size: 1.35rem; letter-spacing: 0.22em; }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    .floral-float {
      animation: floatSlow 7s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen py-6 px-3 sm:py-12 sm:px-6 flex flex-col items-center justify-center relative">

  <!-- Top Bar Controls (Customize Button Removed - Locked Behind PIN 8282) -->
  <div class="fixed top-3 right-3 z-40 flex items-center gap-2">
    <button onclick="shareGuestLink()" class="bg-white/90 backdrop-blur border border-[#b5945b]/40 text-[#6e552c] text-xs font-medium px-3.5 py-2 rounded-full shadow-sm hover:bg-white transition flex items-center gap-1.5">
      <span>🔗 Share Link</span>
    </button>
    <button onclick="promptPin()" title="Host Lock" class="bg-white/80 backdrop-blur border border-[#b5945b]/30 text-[#8c6d3b] w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-sm hover:bg-white transition">
      🔒
    </button>
  </div>

  <!-- Main Arch Card Container -->
  <main class="w-full max-w-lg arch-card p-3 sm:p-5 my-6">
    <div class="arch-inner-border w-full h-full px-5 py-12 sm:px-10 sm:py-16 flex flex-col items-center text-center relative">

      <!-- Top Right Pastel Floral SVG -->
      <svg class="w-40 h-40 sm:w-48 sm:h-48 absolute -top-4 -right-4 pointer-events-none floral-float opacity-90" viewBox="0 0 200 200" fill="none">
        <path d="M120 20 C140 40, 170 50, 185 80 C160 75, 135 65, 120 20 Z" fill="#a3b19b" opacity="0.5"/>
        <path d="M90 10 C110 35, 130 65, 125 95 C105 75, 95 45, 90 10 Z" fill="#8b9d83" opacity="0.45"/>
        <path d="M140 85 C165 95, 185 120, 190 150 C165 135, 150 115, 140 85 Z" fill="#a3b19b" opacity="0.5"/>
        <circle cx="135" cy="55" r="24" fill="#fffdfa" stroke="#e6dec8" stroke-width="1.5"/>
        <circle cx="135" cy="55" r="8" fill="#eab688" opacity="0.8"/>
        <circle cx="160" cy="95" r="20" fill="#fffdfa" stroke="#e6dec8" stroke-width="1.5"/>
        <circle cx="160" cy="95" r="7" fill="#eab688" opacity="0.8"/>
      </svg>

      <!-- Top Left Subtle Foliage -->
      <svg class="w-28 h-28 absolute top-6 -left-4 pointer-events-none opacity-75" viewBox="0 0 120 120" fill="none">
        <path d="M10 80 C25 50, 50 30, 80 15 C65 45, 45 65, 10 80 Z" fill="#a3b19b" opacity="0.45"/>
        <circle cx="40" cy="45" r="14" fill="#fffdfa" stroke="#e6dec8" stroke-width="1.2"/>
      </svg>

      <!-- Header Intro -->
      <p id="dispIntro" class="text-[11px] sm:text-xs tracking-[0.25em] uppercase text-[#7a7064] max-w-xs leading-relaxed mt-4 mb-6">
        TOGETHER WITH THEIR FAMILIES
      </p>

      <!-- Groom & Bride Names (Groom Top, Bride Bottom) -->
      <div class="my-4 w-full flex flex-col items-center justify-center space-y-2">
        <!-- Groom Name (Top) -->
        <div id="dispGroom" class="flex items-baseline justify-center">
          <span class="initial-swash">D</span><span class="name-rest">AVID</span>
        </div>

        <!-- "and" Script -->
        <div class="font-script text-3xl sm:text-4xl text-[#b5945b] py-1">and</div>

        <!-- Bride Name (Bottom) -->
        <div id="dispBride" class="flex items-baseline justify-center">
          <span class="initial-swash">A</span><span class="name-rest">MELIA</span>
        </div>
      </div>

      <!-- Invitation Line -->
      <p id="dispTagline" class="text-[11px] sm:text-xs tracking-[0.22em] uppercase text-[#7a7064] mt-6 mb-8 max-w-xs leading-relaxed">
        INVITE YOU TO THEIR WEDDING CELEBRATION
      </p>

      <!-- Main Date & Location Summary Split -->
      <div class="w-full max-w-md grid grid-cols-2 items-center border-y border-[#b5945b]/30 py-5 my-2">
        <div class="flex flex-col items-center justify-center px-3 border-r border-[#b5945b]/30">
          <svg class="w-6 h-6 text-[#8c6d3b] mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span id="summaryDate" class="text-xs sm:text-sm font-serif-title tracking-wider uppercase text-[#4a4238] font-semibold">DEC 24, 2026</span>
          <span id="summaryTime" class="text-[10px] tracking-widest uppercase text-[#7a7064] mt-0.5">7:00 PM ONWARDS</span>
        </div>

        <div class="flex flex-col items-center justify-center px-3">
          <svg class="w-6 h-6 text-[#8c6d3b] mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span id="summaryVenue" class="text-xs sm:text-sm font-serif-title tracking-wider uppercase text-[#4a4238] font-semibold">ROYAL PALM HALL</span>
          <span id="summaryCity" class="text-[10px] tracking-widest uppercase text-[#7a7064] mt-0.5">MAIN BOULEVARD</span>
        </div>
      </div>

      <!-- Countdown Timer -->
      <div id="countdownBox" class="grid grid-cols-4 gap-3 w-full max-w-xs my-6">
        <div class="bg-[#f4efe6] rounded-xl py-2.5 px-1 border border-[#b5945b]/20">
          <div id="cdDays" class="text-lg sm:text-xl font-serif-title text-[#8c6d3b] font-semibold">00</div>
          <div
