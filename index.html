<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wedding Invitation | Joshwa & Ribeca</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wedding Card" />
  <meta property="og:title" content="You're Invited! Wedding Celebration" />
  <meta property="og:description" content="Tap to view our digital wedding invitation, schedule of events, and RSVP." />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-page: #e7e0d6;
      --bg-card: #f8f5f1;
      --gold-primary: #b5945b;
      --gold-dark: #8c6d3b;
      --text-main: #4a4238;
      --text-muted: #7a7064;
      --sage: #a3b19b;
      --line: rgba(122, 112, 103, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      overflow-x: hidden;
      background: var(--bg-page);
    }

    .arch-card {
      position: relative;
      width: min(90vw, 660px);
      min-height: 700px;
      background: var(--bg-card);
      border-radius: 320px 320px 22px 22px / 240px 240px 22px 22px;
      border: 1.5px solid rgba(181, 148, 91, 0.40);
      box-shadow:
        0 18px 30px rgba(74, 66, 56, 0.08),
        inset 0 0 0 1px rgba(181, 148, 91, 0.15);
      padding: 32px 18px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    .arch-card::before {
      content: "";
      position: absolute;
      inset: 10px 12px 12px;
      border-radius: 300px 300px 18px 18px / 220px 220px 18px 18px;
      border: 1px solid rgba(181, 148, 91, 0.2);
      pointer-events: none;
    }

    .top-left-leaf,
    .top-right-leaf {
      position: absolute;
      width: 130px;
      height: 130px;
      opacity: 0.8;
      pointer-events: none;
      z-index: 0;
    }

    .top-left-leaf {
      left: -22px;
      top: 30px;
      transform: rotate(-18deg);
    }

    .top-right-leaf {
      right: -20px;
      top: 10px;
      transform: rotate(18deg);
    }

    .card-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .intro {
      margin-top: 28px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.38em;
      font-size: 12px;
      font-weight: 500;
      line-height: 1.8;
    }

    .names {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .name-line {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0.9;
      color: var(--gold-dark);
    }

    .initial-swash {
      font-family: 'Pinyon Script', 'Brush Script MT', cursive;
      font-size: clamp(90px, 11vw, 160px);
      font-weight: 400;
      line-height: 0.8;
      transform: translateY(8px);
      display: inline-block;
      margin-right: -10px;
    }

    .name-rest {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(22px, 2.2vw, 40px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.1;
    }

    .and-script {
      font-family: 'Pinyon Script', 'Brush Script MT', cursive;
      font-size: clamp(35px, 4vw, 60px);
      color: var(--gold-dark);
      line-height: 1;
      margin: 6px 0 4px;
    }

    .tagline {
      margin-top: 22px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 12px;
      line-height: 1.8;
      max-width: 440px;
    }

    .divider {
      width: min(80%, 400px);
      border-top: 1px solid var(--line);
      margin: 28px auto 0;
    }

    .info-grid {
      width: min(80%, 420px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-top: 26px;
      gap: 0;
    }

    .info-box {
      min-height: 130px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .info-box:first-child {
      border-right: 1px solid var(--line);
    }

    .icon {
      width: 28px;
      height: 28px;
      color: var(--gold-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .summary-date, .summary-venue {
      color: var(--text-main);
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 15px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      line-height: 1.5;
    }

    .summary-date small, .summary-venue small {
      display: block;
      margin-top: 6px;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 500;
    }

    @media (max-width: 540px) {
      .arch-card {
        min-height: 600px;
        width: min(92vw, 560px);
      }

      .intro, .tagline {
        letter-spacing: 0.22em;
        font-size: 11px;
      }

      .initial-swash {
        font-size: 84px;
      }

      .name-rest {
        letter-spacing: 0.14em;
      }

      .info-grid {
        width: 88%;
      }

      .summary-date, .summary-venue {
        letter-spacing: 0.12em;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="arch-card">
    <div class="top-left-leaf" aria-hidden="true">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 80C25 48 49 28 84 15C67 45 48 64 10 80Z" fill="#b4c1ae" opacity="0.7" />
        <circle cx="42" cy="46" r="12" fill="#f8f5f1" stroke="#d9d0c4" stroke-width="1.2" />
      </svg>
    </div>

    <div class="top-right-leaf" aria-hidden="true">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M115 80C101 48 77 28 42 15C58 45 77 64 115 80Z" fill="#b4c1ae" opacity="0.7" />
        <circle cx="78" cy="46" r="12" fill="#f8f5f1" stroke="#d9d0c4" stroke-width="1.2" />
      </svg>
    </div>

    <div class="card-inner">
      <p class="intro">Together with their families</p>

      <div class="names">
        <div class="name-line">
          <span class="initial-swash">J</span>
          <span class="name-rest">OSHWA</span>
        </div>

        <div class="and-script">and</div>

        <div class="name-line">
          <span class="initial-swash">R</span>
          <span class="name-rest">IBECA</span>
        </div>
      </div>

      <p class="tagline">
        Invite you to their wedding<br />
        celebration
      </p>

      <div class="divider"></div>

      <div class="info-grid">
        <div class="info-box">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="18" rx="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </div>
          <div class="summary-date">
            Dec 24, 2026
            <small>7:00 pm onwards</small>
          </div>
        </div>

        <div class="info-box">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </div>
          <div class="summary-venue">
            Royal Palm Hall
            <small>Main Boulevard</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
