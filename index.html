  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-page: #f2ece4;
      --bg-card: #fbf9f5;
      --gold-primary: #b5945b;
      --gold-dark: #8c6d3b;
      --text-main: #4a4238;
      --text-muted: #7a7064;
      --sage: #a3b19b;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      overflow-x: hidden;
      margin: 0;
    }

    .font-script {
      font-family: 'Pinyon Script', cursive;
    }
    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }
    .font-serif-body {
      font-family: 'Cormorant Garamond', serif;
    }

    /* Arch Card Silhouette */
    .arch-card {
      background-color: var(--bg-card);
      border-radius: 260px 260px 24px 24px;
      box-shadow: 0 20px 60px rgba(74, 66, 56, 0.12), 0 0 0 1px rgba(181, 148, 91, 0.25);
      position: relative;
      overflow: hidden;
    }

    .arch-inner-border {
      border-radius: 250px 250px 18px 18px;
      border: 1px solid rgba(181, 148, 91, 0.35);
      pointer-events: none;
    }

    /* Calligraphic Initial Styling */
    .initial-swash {
      font-family: 'Pinyon Script', cursive;
      font-size: 5.5rem;
      line-height: 0.75;
      color: var(--gold-dark);
      display: inline-block;
      vertical-align: middle;
      margin-right: -4px;
    }

    .name-rest {
      font-family: 'Playfair Display', serif;
      font-size: 1.65rem;
      letter-spacing: 0.28em;
      color: var(--gold-dark);
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .initial-swash { font-size: 4.5rem; }
      .name-rest { font-size: 1.35rem; letter-spacing: 0.22em; }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(1.5deg); }
    }
    .floral-float {
      animation: floatSlow 7s ease-in-out infinite;
    }
  </style>
</head>
